# Local development database. Matches production (Render PostgreSQL 18).
services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
      POSTGRES_DB: wallet
    ports:
      - '5434:5432'
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/<major>/docker
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wallet -d wallet']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
