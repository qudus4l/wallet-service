# Render Blueprint — free tier (ADR-0007). Validate with: render blueprints validate render.yaml
services:
  - type: web
    name: wallet-service
    runtime: node # Node version from .node-version
    plan: free
    region: frankfurt
    branch: main
    # NODE_ENV=production makes npm skip devDependencies, which the builds need; prune after.
    # The React frontend (web/) is built first and served by NestJS from the same origin.
    buildCommand: npm ci --include=dev && npm run build:web && rm -rf web/node_modules && npm run build && npm prune --omit=dev
    # The free plan has no preDeployCommand: migrate + seed, then exec so SIGTERM reaches Node.
    startCommand: node dist/scripts/migrate.js && exec node dist/main.js
    healthCheckPath: /health/ready
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: wallet-db
          property: connectionString # internal (private network) URL
      - key: JWT_SECRET
        generateValue: true # 256-bit random value generated by Render
      - key: ADMIN_EMAIL
        sync: false # set in the Dashboard at creation
      - key: ADMIN_PASSWORD
        sync: false
      - key: DEFAULT_CURRENCY
        value: NGN
      - key: MAX_TRANSACTION_AMOUNT
        value: '1000000000'
      - key: DB_POOL_MAX
        value: '10'
      - key: LOG_LEVEL
        value: info
      - key: SWAGGER_ENABLED
        value: 'true'
      - key: RATE_LIMIT_ENABLED
        value: 'true'
      - key: TRUST_PROXY
        value: '1'

databases:
  - name: wallet-db
    plan: free
    region: frankfurt
    postgresMajorVersion: '18'
    databaseName: wallet
    user: wallet
    ipAllowList: [] # private network only; no public access
